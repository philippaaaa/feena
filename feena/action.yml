name: "Feena"
description: >
  Independent adversarial testing on every pull request: a hostile agent attacks your running app,
  the committed regression tests re-check every bug you already fixed, and one comment reports it.
  No API key required.
author: "Feena"
branding:
  icon: shield
  color: red

inputs:
  url:
    description: >
      URL of your app, already running on the runner (e.g. http://localhost:3000). Start it in an
      earlier step. Only loopback/private addresses are accepted; Feena never tests a public host.
    required: true
  config:
    description: "Path to feena.yaml (seeded test accounts). Optional."
    default: "feena.yaml"
  tests:
    description: "Directory of committed regression tests (from `feena adopt`)."
    default: "tests/feena"
  baseline:
    description: "Known/accepted findings file (from `feena baseline`). CI fails only on NEW findings."
    default: "feena.baseline.json"
  fail-on:
    description: "Fail on NEW findings at or above this severity: critical | high | medium | low | none."
    default: "high"
  wait:
    description: "Seconds to wait for the app to become healthy."
    default: "60"
  comment:
    description: "Post/update a single pull request comment ('true' or 'false')."
    default: "true"
  base:
    description: >
      Git ref to diff against (e.g. origin/main) so agents focus on the routes
      this PR affects. Needs history: use actions/checkout with fetch-depth 0. Empty = unfocused.
    default: ""
  browser:
    description: "Install Chromium so XSS checks can read the rendered DOM of client-rendered apps."
    default: "true"
  upload-report:
    description: "Upload the report and generated tests as a workflow artifact."
    default: "true"
  python-version:
    description: "Python version used to run Feena."
    default: "3.12"
  github-token:
    description: "Token used to post the PR comment. Needs `pull-requests: write`."
    default: ${{ github.token }}

outputs:
  new-findings:
    description: "Number of findings not covered by the baseline."
    value: ${{ steps.feena.outputs.new-findings }}
  regression-failures:
    description: "Number of committed regression tests that failed."
    value: ${{ steps.feena.outputs.regression-failures }}
  failed:
    description: "'true' if the check failed."
    value: ${{ steps.feena.outputs.failed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Feena
      shell: bash
      env:
        FEENA_SRC: ${{ github.action_path }}
      run: python -m pip install --quiet "$FEENA_SRC"

    - name: Install browser
      if: inputs.browser == 'true'
      shell: bash
      run: python -m playwright install --with-deps chromium

    # Inputs reach the script only through env vars, never by interpolation into the script text,
    # so a hostile input value cannot inject shell commands.
    - name: Run Feena
      id: feena
      shell: bash
      env:
        FEENA_URL: ${{ inputs.url }}
        FEENA_CONFIG: ${{ inputs.config }}
        FEENA_TESTS: ${{ inputs.tests }}
        FEENA_BASELINE: ${{ inputs.baseline }}
        FEENA_FAIL_ON: ${{ inputs.fail-on }}
        FEENA_WAIT: ${{ inputs.wait }}
        FEENA_COMMENT: ${{ inputs.comment }}
        FEENA_BASE: ${{ inputs.base }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        args=(ci --url "$FEENA_URL" --config "$FEENA_CONFIG" --tests "$FEENA_TESTS" \
              --baseline "$FEENA_BASELINE" --fail-on "$FEENA_FAIL_ON" --wait "$FEENA_WAIT")
        if [ "$FEENA_COMMENT" != "true" ]; then args+=(--no-comment); fi
        if [ -n "$FEENA_BASE" ]; then args+=(--base "$FEENA_BASE"); fi
        feena "${args[@]}"

    - name: Upload Feena report
      if: always() && inputs.upload-report == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: feena-report
        path: |
          .feena/report.md
          .feena/comment.md
          .feena/verification.json
          .feena/blast-radius.json
          .feena/run-stats.json
          .feena/tests
        if-no-files-found: ignore
