[project]
name = "feena"
version = "0.0.1"
description = "Agents that use, break, and attack your app in a sandbox on every PR."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "playwright>=1.49",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "click>=8.1",
    "docker>=7.1",
    "httpx>=0.27",
    "anthropic>=0.39",
    "rich>=13.7",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "flask>=3.0", "mcp>=1.30,<2"]
mcp = ["mcp>=1.30,<2"]

[project.scripts]
feena = "feena.cli:main"
feena-mcp = "feena.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feena = ["onboarding.html"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# Feena's own suite only. examples/**/generated-tests are sample output that needs a live target.
testpaths = ["tests"]
